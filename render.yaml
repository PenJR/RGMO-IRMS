services:
  - type: web
    name: rgmo-irms
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./rgmo-irms
    dockerfilePath: ./rgmo-irms/Dockerfile
    healthCheckPath: /up
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_NAME
        value: RGMO-IRMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: rgmo-irms-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite

databases:
  - name: rgmo-irms-db
    plan: free
    region: singapore
    databaseName: rgmo_irms
    postgresMajorVersion: "16"
    ipAllowList: []
